[project]
name = "sec-filing-agent"
version = "0.1.0"
description = "Minimal local FastAPI service skeleton."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2.0",
    "asyncpg>=0.30,<1.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "structlog>=25.1,<26.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.scripts]
sec-filing-agent = "sec_filing_agent.main:run"
sec-filing-agent-dev = "sec_filing_agent.dev:run"
dev = "sec_filing_agent.dev:run"

[dependency-groups]
dev = ["pytest>=8.3,<9.0", "ruff>=0.9,<1.0"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
